<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | SEPHORREAL</title><script src="https://cdn.tailwindcss.com/3.4.17"></script><script src="../js/tailwind-config.js"></script></head><body class="font-sans text-black"><main class="mx-auto max-w-2xl px-5 py-16"><a href="keranjang.html" class="text-sm underline">← Kembali ke keranjang</a><h1 class="mt-10 border-b-2 border-black pb-5 text-4xl font-bold uppercase">Checkout</h1><p class="mt-6 text-gray-600">Ringkasan produk yang dipilih dari keranjang:</p><div id="checkout-list" class="mt-6 divide-y"></div><div class="mt-6 flex justify-between border-t-2 border-black pt-5 text-xl font-bold"><span>Total sementara</span><span id="checkout-total">Rp0</span></div><p class="mt-4 text-sm text-gray-500">Halaman ini hanya menampilkan pilihan dari keranjang. Pengiriman dan pembayaran belum diimplementasikan.</p></main><script src="../js/products.js"></script><script>const list=JSON.parse(sessionStorage.getItem('sephorreal_checkout_selection')||'[]');const rupiah=n=>'Rp'+Math.round(n).toLocaleString('id-ID');let total=0;document.getElementById('checkout-list').replaceChildren(...list.map(i=>{const p=(window.PRODUK||[]).find(p=>p.id===i.id&&p.nama===i.nama);const unit=p?Math.round(p.harga*(1-(p.diskon||0)/100)):Number(i.harga)||0;total+=unit*i.qty;const row=document.createElement('div');row.className='flex justify-between gap-5 py-4 text-sm';const name=document.createElement('span');name.textContent=i.nama+' × '+i.qty;const amount=document.createElement('strong');amount.textContent=rupiah(unit*i.qty);row.append(name,amount);return row}));document.getElementById('checkout-total').textContent=rupiah(total);</script></body></html>
